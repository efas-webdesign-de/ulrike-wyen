headline: "Seit vielen Jahren widme ich mich der Planung öffentlicher und privater Innenräume."
lead: "So verschieden die Ansprüche sind, im Kern geht es immer um dasselbe: die Optimierung der zur Verfügung stehenden Fläche, der Abläufe und das Wohlbefinden der Menschen, die sich darin aufhalten."
body:
  - "Aspekte wie Akustik- und Lichtplanung, Farbkonzept und Materialwahl, Möblierung und eine intelligente Raumaufteilung haben entscheidenden Einfluss auf die räumliche Atmosphäre sowie die Effizienz von Bewohnerinnen, Klienten, Mitarbeitenden und Patient:innen. Durch meine Projekte habe ich auch im Bereich des barrierefreien Bauens umfassende Erfahrungen sammeln können."
  - "Abgestimmt wird bis ins Detail, damit Ihre Räume Ihre Geschichte erzählen. Sie als Kunde bestimmen, in welcher Form ich Sie ggf. mit meinem Netzwerk unterstützen darf: von einer einfachen Beratung oder dem Erstellen eines Konzeptes über die Ausführungsplanung bis hin zur Fertigstellung des Umbauprozesses."
