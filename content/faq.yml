items:
  - question: "Für welche Räume planen Sie?"
    answer: "Arztpraxen, Büros und Gewerbeflächen, Küchen, private Wohnräume sowie Cafés und Gastronomie - von einzelnen Räumen bis zur kompletten Fläche."
  - question: "Wie läuft die Zusammenarbeit ab?"
    answer: "Am Anfang steht ein unverbindliches Erstgespräch. Danach entscheiden Sie, in welchem Umfang ich Sie begleite: von der Beratung über das Konzept und die Ausführungsplanung bis zur Fertigstellung."
  - question: "Arbeiten Sie auch nur beratend?"
    answer: "Ja. Sie bestimmen den Umfang - das kann eine einmalige Beratung sein oder die durchgehende Begleitung inklusive meinem Netzwerk aus Handwerk und Herstellern."
  - question: "In welchem Umkreis arbeiten Sie?"
    answer: "Schwerpunkt ist Köln und das Rheinland. Projekte darüber hinaus sind nach Absprache gerne möglich."
  - question: "Was kostet die Zusammenarbeit?"
    answer: "Das hängt von Umfang und Leistung ab. Nach dem Erstgespräch erhalten Sie ein transparentes, auf Ihr Projekt abgestimmtes Angebot."
